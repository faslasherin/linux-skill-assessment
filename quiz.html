<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Skill Assessment - Exam</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f8fafc'/><text y='.9em' font-size='80' x='50%' text-anchor='middle' fill='%232563eb'>🐧</text></svg>">
</head>
<body>
    <header class="exam-header">
        <div class="header-content">
            <div class="logo">
                <svg viewBox="0 0 40 40" class="logo-icon">
                    <rect x="2" y="2" width="36" height="36" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
                    <rect x="8" y="10" width="24" height="2" rx="1" fill="currentColor"/>
                    <rect x="8" y="16" width="24" height="2" rx="1" fill="currentColor" opacity="0.7"/>
                    <rect x="8" y="22" width="16" height="2" rx="1" fill="currentColor" opacity="0.5"/>
                    <rect x="8" y="28" width="20" height="2" rx="1" fill="currentColor" opacity="0.3"/>
                </svg>
                <span>Linux Skill Assessment</span>
            </div>
        </div>
    </header>

    <main class="exam-main">
        <div class="exam-container">
            <div class="exam-info-bar">
                <div class="student-info">
                    <div class="student-avatar" id="student-avatar">
                        <svg viewBox="0 0 24 24" class="avatar-icon">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div class="student-details">
                        <span class="student-label">Student</span>
                        <span class="student-name" id="display-name">Loading...</span>
                    </div>
                </div>
                <div class="question-counter" id="question-counter">
                    Question 1 of 25
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
            </div>

            <div class="exam-card">
                <div class="question-area" id="question-area">
                    <div class="question-number" id="question-number">Question 1</div>
                    <div class="question-text" id="question-text">
                        Loading question...
                    </div>
                </div>

                <div class="options-container" id="options-container"></div>

                <div class="navigation-bar">
                    <div class="nav-info" id="nav-info">
                        <span class="nav-hint">Questions marked with <svg viewBox="0 0 16 16" class="nav-dot"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg> have been answered</span>
                    </div>
                    <div class="nav-buttons">
                        <button type="button" class="btn btn-outline" id="prev-btn" disabled>
                            <svg viewBox="0 0 20 20" class="btn-icon">
                                <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
                            </svg>
                            Previous
                        </button>
                        <button type="button" class="btn btn-primary" id="next-btn">
                            Next
                            <svg viewBox="0 0 20 20" class="btn-icon">
                                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/questions.js"></script>
    <script>
    // Quiz page logic - standalone (does NOT load app.js to avoid conflicts)
    (function() {
        'use strict';
        
        const displayName = document.getElementById('display-name');
        const questionNumber = document.getElementById('question-number');
        const questionText = document.getElementById('question-text');
        const questionCounter = document.getElementById('question-counter');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const optionsContainer = document.getElementById('options-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        // Get student info from localStorage (set by app.js after form submission on index.html)
        const storedName = localStorage.getItem('lsa_studentName');
        const storedEmail = localStorage.getItem('lsa_studentEmail');
        
        // Initialize state - use real student data if available, otherwise fallback for testing
        const state = {
            studentName: storedName || 'Test Student',
            studentEmail: storedEmail || 'student@example.com',
            questions: shuffleQuestions(QUESTIONS, true),
            currentIndex: 0,
            answers: {},
            isAnswerShuffled: true,
            isSubmitted: false
        };
        
        // Store quiz state in localStorage
        localStorage.setItem('lsa_questions', JSON.stringify(state.questions));
        localStorage.setItem('lsa_currentIndex', '0');
        localStorage.setItem('lsa_answers', JSON.stringify({}));
        
        displayName.textContent = state.studentName;
        
        function renderQuestion() {
            const question = state.questions[state.currentIndex];
            if (!question) return;
            
            questionNumber.textContent = `Question ${state.currentIndex + 1}`;
            questionText.textContent = question.question;
            questionCounter.textContent = `Question ${state.currentIndex + 1} of ${state.questions.length}`;
            
            const progress = ((state.currentIndex + 1) / state.questions.length) * 100;
            progressBarFill.style.width = `${progress}%`;
            
            // Update buttons
            prevBtn.disabled = state.currentIndex === 0;
            
            if (state.currentIndex === state.questions.length - 1) {
                nextBtn.innerHTML = `
                    Submit Assessment
                    <svg viewBox="0 0 20 20" class="btn-icon">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                    </svg>
                `;
            } else {
                nextBtn.innerHTML = `
                    Next
                    <svg viewBox="0 0 20 20" class="btn-icon">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                    </svg>
                `;
            }
            
            // Render options
            renderOptions(question);
        }
        
        function renderOptions(question) {
            optionsContainer.innerHTML = '';
            
            const markers = ['A', 'B', 'C', 'D'];
            
            for (let i = 0; i < question.options.length; i++) {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option not-selected';
                optionDiv.dataset.option = i.toString();
                
                const radioId = `option-${i}`;
                optionDiv.innerHTML = `
                    <input type="radio" name="answer" id="${radioId}" value="${i}">
                    <label for="${radioId}">
                        <span class="option-marker">${markers[i]}</span>
                        <span class="option-text" id="${radioId}-text">${question.options[i]}</span>
                    </label>
                `;
                
                // Check if previously selected
                if (state.answers[question.id] === i) {
                    optionDiv.classList.add('selected');
                }
                
                optionsContainer.appendChild(optionDiv);
            }
            
            // Add click handlers
            optionsContainer.querySelectorAll('.option').forEach(el => {
                el.addEventListener('click', function() {
                    const radio = this.querySelector('input[type="radio"]');
                    if (radio) {
                        radio.checked = true;
                        optionsContainer.querySelectorAll('.option').forEach(o => {
                            o.classList.remove('selected');
                            o.classList.add('not-selected');
                        });
                        this.classList.add('selected');
                        this.classList.remove('not-selected');
                        
                        const q = state.questions[state.currentIndex];
                        state.answers[q.id] = parseInt(radio.value, 10);
                    }
                });
            });
        }
        
        function goToNext() {
            if (state.currentIndex < state.questions.length - 1) {
                // Save current answer before moving
                saveAnswersToLocalStorage();
                state.currentIndex++;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                // Submit
                submitAssessment();
            }
        }
        
        function goToPrevious() {
            if (state.currentIndex > 0) {
                // Save current answer before moving
                saveAnswersToLocalStorage();
                state.currentIndex--;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
        
        function saveAnswersToLocalStorage() {
            localStorage.setItem('lsa_answers', JSON.stringify(state.answers));
        }
        
        function submitAssessment() {
            // Save state
            localStorage.setItem('lsa_currentIndex', state.currentIndex.toString());
            localStorage.setItem('lsa_answers', JSON.stringify(state.answers));
            
            // Calculate results
            let correct = 0;
            state.questions.forEach(q => {
                if (state.answers[q.id] === q.correctAnswer) {
                    correct++;
                }
            });
            
            const total = state.questions.length;
            const percentage = Math.round((correct / total) * 100);
            const passed = percentage >= 60;
            
            const assessmentDate = new Date().toLocaleString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            const results = {
                studentName: state.studentName,
                studentEmail: state.studentEmail,
                assessmentDate: assessmentDate,
                totalQuestions: total,
                correctAnswers: correct,
                incorrectAnswers: total - correct,
                score: `${correct} / ${total}`,
                percentage: percentage,
                passed: passed
            };
            
            localStorage.setItem('lsa_results', JSON.stringify(results));
            localStorage.setItem('lsa_isSubmitted', 'true');
            
            window.location.href = 'result.html';
        }
        
        // Event listeners
        nextBtn.addEventListener('click', goToNext);
        prevBtn.addEventListener('click', goToPrevious);
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                goToPrevious();
            } else if (e.key === 'ArrowRight') {
                goToNext();
            } else if (e.key >= '1' && e.key <= '4') {
                const index = parseInt(e.key, 10) - 1;
                const radio = document.getElementById(`option-${index}`);
                if (radio) {
                    radio.checked = true;
                    radio.dispatchEvent(new Event('click'));
                }
            }
        });
        
        // Initial render
        renderQuestion();
    })();
    </script>
</body>
</html>
