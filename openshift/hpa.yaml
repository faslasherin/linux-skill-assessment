apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: linux-skill-assessment
  namespace: faslasherin-dev
spec:
  maxReplicas: 6
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 60
        type: Utilization
    type: Resource
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linux-skill-assessment
