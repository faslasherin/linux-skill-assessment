<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Skill Assessment - Results</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f8fafc'/><text y='.9em' font-size='80' x='50%' text-anchor='middle' fill='%232563eb'>🐧</text></svg>">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <svg viewBox="0 0 40 40" class="logo-icon">
                    <rect x="2" y="2" width="36" height="36" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
                    <rect x="8" y="10" width="24" height="2" rx="1" fill="currentColor"/>
                    <rect x="8" y="16" width="24" height="2" rx="1" fill="currentColor" opacity="0.7"/>
                    <rect x="8" y="22" width="16" height="2" rx="1" fill="currentColor" opacity="0.5"/>
                    <rect x="8" y="28" width="20" height="2" rx="1" fill="currentColor" opacity="0.3"/>
                </svg>
                <span class="logo-text">Linux Skill Assessment</span>
            </div>
        </div>
    </header>

    <main class="result-main">
        <div class="result-container">
            <div class="result-card">
                <div class="result-header" id="result-header">
                    <div class="result-icon" id="result-icon">
                        <svg viewBox="0 0 48 48" class="result-svg icon-pass">
                            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
                            <path d="M14 28l6-6 6 6M14 20l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <svg viewBox="0 0 48 48" class="result-svg icon-fail" style="display:none">
                            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
                            <path d="M16 16l16 16M32 16l-16 16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2 class="result-title" id="result-title">EXAM COMPLETED</h2>
                    <div class="result-status" id="result-status">PASS</div>
                </div>

                <div class="result-body">
                    <div class="result-info">
                        <div class="info-row">
                            <span class="info-label">
                                <svg viewBox="0 0 20 20" class="info-icon">
                                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                Student Name
                            </span>
                            <span class="info-value" id="result-name">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">
                                <svg viewBox="0 0 20 20" class="info-icon">
                                    <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                                    <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                                </svg>
                                Email Address
                            </span>
                            <span class="info-value" id="result-email">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">
                                <svg viewBox="0 0 20 20" class="info-icon">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
                                </svg>
                                Assessment Date
                            </span>
                            <span class="info-value" id="result-date">-</span>
                        </div>
                        <div class="info-divider"></div>
                        <div class="info-row">
                            <span class="info-label">
                                <svg viewBox="0 0 20 20" class="info-icon">
                                    <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
                                    <path d="M3 5a2 2 0 012-2 3 3 0 003 3h6a3 3 0 003-3 2 2 0 012 2v6h2a1 1 0 100-2h-6V5z"/>
                                </svg>
                                Total Questions
                            </span>
                            <span class="info-value" id="result-total">25</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">
                                <svg viewBox="0 0 20 20" class="info-icon icon-correct">
                                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                                </svg>
                                Correct Answers
                            </span>
                            <span class="info-value info-value-correct" id="result-correct">0</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">
                                <svg viewBox="0 0 20 20" class="info-icon icon-incorrect">
                                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                </svg>
                                Incorrect Answers
                            </span>
                            <span class="info-value info-value-incorrect" id="result-incorrect">0</span>
                        </div>
                        <div class="info-divider"></div>
                        <div class="info-row info-row-highlight">
                            <span class="info-label">
                                <svg viewBox="0 0 20 20" class="info-icon">
                                    <path fill-rule="evenodd" d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5z"/>
                                    <path fill-rule="evenodd" d="M20 11a1 1 0 01-1-1h-2a1 1 0 01-1 1v5a1 1 0 011 1h2a1 1 0 011-1v-5zM6 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H7a1 1 0 01-1-1v-5zM14 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1h-2a1 1 0 01-1-1v-5z" clip-rule="evenodd"/>
                                </svg>
                                Score
                            </span>
                            <span class="info-value info-value-score" id="result-score">0 / 25</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">
                                <svg viewBox="0 0 20 20" class="info-icon">
                                    <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5z"/>
                                    <path d="M10 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2h-2z"/>
                                    <path d="M13 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2V5z"/>
                                    <path d="M15 5a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2h-2z"/>
                                </svg>
                                Percentage
                            </span>
                            <span class="info-value info-value-percentage" id="result-percentage">0%</span>
                        </div>
                    </div>

                    <div class="result-actions">
                        <button type="button" class="btn btn-outline" id="download-pdf-btn">
                            <svg viewBox="0 0 20 20" class="btn-icon">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
                                <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h6a3 3 0 003-3 2 2 0 012 2v6h2a1 1 0 100-2h-6V5z"/>
                                <path d="M16 7a1 1 0 100-2 1 1 0 000 2z"/>
                            </svg>
                            Download Result PDF
                        </button>
                        <button type="button" class="btn btn-primary" id="retry-btn">
                            <svg viewBox="0 0 20 20" class="btn-icon">
                                <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.879.625H5.25a1 1 0 01-1-1V3a1 1 0 011-1h11.5a1 1 0 011 1v2.101a7.002 7.002 0 01-3.898 1.134 1 1 0 01-1.879-.625H13.75a1 1 0 01-1-1V3a1 1 0 011-1H4z" clip-rule="evenodd"/>
                                <path d="M12.5 8a1 1 0 100-2 1 1 0 000 2z"/>
                            </svg>
                            Take Assessment Again
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Linux Skill Assessment. For educational purposes only.</p>
        </div>
    </footer>

    <script src="js/questions.js"></script>
    <script src="js/app.js"></script>
    <script>
    // Result page standalone logic (in case app.js isn't loaded)
    (function() {
        if (!window.__lsaState || !localStorage.getItem('lsa_results')) {
            // Fallback - check localStorage directly
            const resultsJson = localStorage.getItem('lsa_results');
            if (resultsJson) {
                const results = JSON.parse(resultsJson);
                renderResultsFromJSON(results);
            }
        }
        
        function renderResultsFromJSON(results) {
            const passIcon = document.querySelector('.icon-pass');
            const failIcon = document.querySelector('.icon-fail');
            
            if (results.passed) {
                passIcon.style.display = 'block';
                failIcon.style.display = 'none';
            } else {
                passIcon.style.display = 'none';
                failIcon.style.display = 'block';
            }
            
            document.getElementById('result-status').textContent = results.passed ? 'PASS' : 'FAIL';
            document.getElementById('result-status').className = `result-status ${results.passed ? 'pass' : 'fail'}`;
            document.getElementById('result-name').textContent = results.studentName;
            document.getElementById('result-email').textContent = results.studentEmail;
            document.getElementById('result-date').textContent = results.assessmentDate;
            document.getElementById('result-total').textContent = results.totalQuestions;
            document.getElementById('result-correct').textContent = results.correctAnswers;
            document.getElementById('result-incorrect').textContent = results.incorrectAnswers;
            document.getElementById('result-score').textContent = results.score;
            
            const percentageEl = document.getElementById('result-percentage');
            percentageEl.textContent = `${results.percentage}%`;
            percentageEl.style.color = results.passed ? 'var(--success)' : 'var(--danger)';
        }
    })();
    </script>
</body>
</html>
